name: Build Myriad backend (Discord Gateway URL fix)

# 在 CI 里编译打了 Discord Gateway 补丁的 Myriad backend 镜像，
# 推送到 GitHub Container Registry (ghcr.io)，供服务器 docker pull。
#
# 修复内容：v0.8.0 的 backend/src/services/discord_bot.rs 中
#   with_gateway_query() 在 Discord 返回不带尾部斜杠的
#   wss://gateway.discord.gg 时，会拼成 wss://gateway.discord.gg?v=10...
#   缺少根路径 /，Discord 返回 400，导致原生 Discord 机器人连不上。
#
# 说明：源码直接从上游 Myriad-You/Myriad 检出（不依赖 fork 的 tag），
#       因为 GitHub fork 不会复制 tag，checkout v0.8.0 会失败。
#
# 触发方式：仓库 Actions 页面手动 Run workflow

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to push'
        required: false
        default: 'v0.8.0-discord-fix'
      source_repo:
        description: 'Source repository (owner/name)'
        required: false
        default: 'Myriad-You/Myriad'
      source_ref:
        description: 'Source version (tag or commit)'
        required: false
        default: 'v0.8.0'

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 免费 runner 磁盘约 14G，Rust 全量构建会吃满，先腾空间
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h /

      - name: Checkout upstream source
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.source_repo }}
          ref: ${{ inputs.source_ref }}
          submodules: recursive

      - name: Show source revision
        run: |
          git log -1 --format='%H %s'
          git submodule status

      - name: Apply Discord Gateway URL fix
        run: |
          echo '' | base64 -d > /tmp/patch_discord.py
          python3 /tmp/patch_discord.py
          echo '--- patched function ---'
          grep -n -A16 'fn with_gateway_query' backend/src/services/discord_bot.rs

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.backend
          platforms: linux/amd64
          push: true
          build-args: |
            MYRIAD_VERSION=${{ inputs.tag }}
            MYRIAD_COMMIT_SHA=${{ github.sha }}
          tags: ghcr.io/${{ github.repository_owner }}/myriad-backend:${{ inputs.tag }}
